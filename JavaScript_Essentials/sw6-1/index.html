<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        alert("Let's calculate the volume of a box, baby! Enter the w/h/l.");
        const width = prompt("Enter the width", 0);
        const height = prompt("Enter the height", 0);
        const length = prompt("Enter the length", 0);
        const volume = width * height * length;
        alert(`The box volume calculated is ${volume}`);
    </script>
</body>
</html>
