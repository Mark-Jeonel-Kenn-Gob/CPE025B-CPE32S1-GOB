<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Code-Along</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>This is an h1 element.</h1>
    </header>

    <main>
        <h2>Now, THIS is an h2 element.</h2>

        <div class="product">
            <div class="product-image">
                <img src="https://i.pinimg.com/originals/47/88/a8/4788a805013eeb40e8c5ba6e0647c0c4.jpg?nii=t" width="100%" alt="Sample Meowl">
                <span class="badge">Meowl!</span>
            </div>
            <p>This will be styled like a simple product description. Meow hoot.</p>
        </div>

        <table class="product-specs">
            <tr>
                <th>Feature</th>
                <th>Detail</th>
            </tr>
            <tr>
                <td>Type</td>
                <td>Sample</td>
            </tr>
            <tr>
                <td>Status</td>
                <td>Demo</td>
            </tr>
        </table>

        <div class="contact-form">
            <form>
                <fieldset>
                    <legend>Contact</legend>
                    <label for="email">Email:</label>
                    <input type="email" id="email">
                    <button type="submit">Submit</button>
                </fieldset>
            </form>
        </div>

        <p>
            Inquire now through this 
            <a href="mailto:test@email.com" class="fake-link">link</a>.
        </p>
    </main>

    <footer>
        <p>© 2026 Meowl Industries</p>
    </footer>

</body>
</html>
